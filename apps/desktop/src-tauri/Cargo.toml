[package]
name = "platscope-desktop"
default-run = "platscope"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PlatScope desktop shell"

[[bin]]
name = "platscope"
path = "src/main.rs"

[lib]
name = "platscope_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
chrono.workspace = true
platscope-core = { path = "../../../crates/platscope-core" }
platscope-domain = { path = "../../../crates/platscope-domain" }
platscope-readonly-scan = { path = "../../../crates/platscope-readonly-scan" }
platscope-storage = { path = "../../../crates/platscope-storage" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
