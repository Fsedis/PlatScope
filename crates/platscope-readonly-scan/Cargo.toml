[package]
name = "platscope-readonly-scan"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Windows read-only Warframe session scanner and bounded inventory fetch"

[dependencies]
anyhow = "1"
flate2 = "1"
sha2.workspace = true
chrono.workspace = true
platscope-domain = { path = "../platscope-domain" }
regex = "1"
memchr = "2"
reqwest.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
zeroize.workspace = true
zstd-safe = { version = "7", features = ["experimental"] }

windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
platscope-inventory = { path = "../platscope-inventory" }

# This Windows boundary is the sole workspace exception to `unsafe_code = forbid`:
# Windows process-memory APIs require FFI calls. The rest of PlatScope remains safe Rust.
[lints.rust]
unsafe_code = "allow"
