name: Публичный релиз

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 · NSIS и автообновление
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7

      - name: Проверить версию тега
        shell: pwsh
        run: |
          $configured = (Get-Content -Raw 'apps/desktop/src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          if ('v' + $configured -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match application version $configured"
          }

      - name: Установить .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Установить pnpm
        uses: pnpm/action-setup@v6

      - name: Установить Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Установить Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Восстановить Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Проверить форматирование Rust
        run: cargo fmt --all -- --check

      - name: Проверить Rust lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Выполнить Rust tests
        run: cargo test --workspace --all-features

      - name: Проверить Svelte и TypeScript
        run: pnpm check

      - name: Выполнить frontend tests
        run: pnpm test

      - name: Собрать и опубликовать релиз
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: PlatScope ${{ github.ref_name }}
          releaseBody: |
            Минорное обновление PlatScope.

            Исправлена читаемость формы выставления ордера Warframe Market в светлой кремовой теме: заголовки, статусы, подписи полей и подтверждения теперь используют контрастные цвета интерфейса.

            Установщик пока не имеет коммерческой Authenticode-подписи издателя, поэтому Windows SmartScreen может показать предупреждение. Обновления внутри PlatScope проверяются криптографической подписью Tauri.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: false

      - name: Опубликовать SHA-256 установщика
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleDirectory = 'target/release/bundle/nsis'
          $installers = Get-ChildItem -LiteralPath $bundleDirectory -Filter '*.exe' -File
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          $hash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($installers[0].Name)" | Set-Content -LiteralPath "$bundleDirectory/SHA256SUMS.txt" -Encoding ascii
          gh release upload '${{ github.ref_name }}' "$bundleDirectory/SHA256SUMS.txt" --clobber
